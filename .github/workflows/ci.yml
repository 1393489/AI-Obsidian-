name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          # ubuntu-latest is 24.04 now, which no longer ships a Python 3.9 that
          # setup-python can install — the step failed before any code ran.
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests (no third-party dependencies)
        run: python -m unittest discover -s tests -t . -v

      # Its own step, and deliberately non-gating: `doctor` exits 1 by design when it
      # finds no session archives, which is the normal state of a fresh runner. The
      # report stays visible in the log; it must not decide whether the job is red.
      - name: Doctor (environment report)
        continue-on-error: true
        run: python -m memloom doctor

      - name: CLI smoke test on the bundled fixtures
        run: |
          python -m memloom scan --root tests/fixtures
          python -m memloom build --out out/ci --root tests/fixtures --quiet --json > first.json
          python -m json.tool first.json

      - name: Second build must parse nothing and write nothing
        run: |
          python -m memloom build --out out/ci --root tests/fixtures --quiet --json > second.json
          python -c "import json;d=json.load(open('second.json',encoding='utf-8'));assert d['written']==0,d;assert d['parsed']==0,d;assert d['reused']>0,d;print('incremental ok:',d['reused'],'reused, 0 parsed, 0 written')"

      - name: --full must rebuild from scratch
        run: |
          python -m memloom build --out out/ci --root tests/fixtures --quiet --json --full > full.json
          python -c "import json;d=json.load(open('full.json',encoding='utf-8'));assert d['reused']==0,d;assert d['parsed']>0,d;print('full ok:',d['parsed'],'parsed')"

      - name: Install check (editable, no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m memloom --version
          # A bare `scan` exits 1 on a machine with no archives — which is exactly
          # what a fresh runner is. Point it at the bundled fixtures instead.
          python -m memloom scan --root tests/fixtures
